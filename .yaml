trigger:
  branches:
    include:
      - feature

pool:
  name: infra-pool

stages:

# =========================
# Stage 1 - Terraform Plan
# =========================
- stage: TerraformPlan
  displayName: "Terraform Plan"

  jobs:
  - job: Plan
    displayName: "Terraform Plan Job"

    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "latest"

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: "azurerm"
        command: "init"
        backendServiceArm: "dev-infra"
        backendAzureRmResourceGroupName: "backend-rg"
        backendAzureRmStorageAccountName: "backendtfstatestorage123"
        backendAzureRmContainerName: "backendcontainer"
        backendAzureRmKey: "tfstate"

    - task: Gitleaks@3
      displayName: "Gitleaks Scan"
      inputs:
        scanlocation: "$(Build.SourcesDirectory)"
        configtype: "default"
        reportformat: "sarif"

    - task: tfsec@1
      displayName: "Terraform Security Scan"
      inputs:
        version: "v1.26.0"

    - task: TerraformTask@5
      displayName: "Terraform Validate"
      inputs:
        provider: "azurerm"
        command: "validate"

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: "azurerm"
        command: "plan"
        environmentServiceNameAzureRM: "dev-infra"
        environmentAzureRmOverrideSubscriptionID: "d4fb712a-aae3-49cf-8c1b-9ed8f8b11a56"

# =========================
# Stage 2 - Terraform Apply
# Manual Approval Required
# =========================
- stage: TerraformApply
  displayName: "Terraform Apply"
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
  - deployment: Apply
    displayName: "Terraform Apply Deployment"

    environment: "prod"

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              backendServiceArm: "dev-infra"
              backendAzureRmResourceGroupName: "backend-rg"
              backendAzureRmStorageAccountName: "backendtfstatestorage123"
              backendAzureRmContainerName: "backendcontainer"
              backendAzureRmKey: "tfstate"

          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              environmentServiceNameAzureRM: "dev-infra"
              environmentAzureRmOverrideSubscriptionID: "d4fb712a-aae3-49cf-8c1b-9ed8f8b11a56"